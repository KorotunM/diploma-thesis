global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:8001"]
        labels:
          service: scheduler
          layer: control
    metrics_path: /metrics
  - job_name: parser
    static_configs:
      - targets: ["parser:8002"]
        labels:
          service: parser
          layer: ingestion
    metrics_path: /metrics
  - job_name: normalizer
    static_configs:
      - targets: ["normalizer:8003"]
        labels:
          service: normalizer
          layer: resolution
    metrics_path: /metrics
  - job_name: backend
    static_configs:
      - targets: ["backend:8004"]
        labels:
          service: backend
          layer: delivery
    metrics_path: /metrics
  # Worker processes own the pipeline domain metrics (parse/normalize/card build).
  # They run no FastAPI server, so each exposes a standalone exporter on :9100.
  - job_name: scheduler-worker
    static_configs:
      - targets: ["scheduler-worker:9100"]
        labels:
          service: scheduler-worker
          layer: control
    metrics_path: /metrics
  - job_name: parser-worker
    static_configs:
      - targets: ["parser-worker:9100"]
        labels:
          service: parser-worker
          layer: ingestion
    metrics_path: /metrics
  - job_name: normalizer-worker
    static_configs:
      - targets: ["normalizer-worker:9100"]
        labels:
          service: normalizer-worker
          layer: resolution
    metrics_path: /metrics
